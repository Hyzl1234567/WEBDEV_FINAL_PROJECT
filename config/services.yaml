parameters:
    images_directory: '%kernel.project_dir%/public/uploads/images'
    app.timezone: 'Asia/Manila'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Session Handler
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
            - { db_table: 'sessions', lock_mode: 1 }

    # Activity Log Doctrine Listener
    App\EventListener\ActivityLogDoctrineListener:
        tags:
            - { name: doctrine.event_subscriber }

    # User Checker for status validation
    App\Security\UserChecker:
        tags:
            - { name: security.user_checker }

    # Firebase Authentication Service for mobile app Google Sign-In
    App\Service\FirebaseAuthService:
        arguments:
            $credentialsPath: '%kernel.project_dir%/config/firebase/serviceAccountKey.json'

    # Firebase Cloud Messaging Service for push notifications
    App\Service\NotificationService:
        arguments:
            $credentialsPath: '%kernel.project_dir%/config/firebase/serviceAccountKey.json'

    # Inject user data (id, email, roles, etc.) into the JWT login response
    # so the mobile app can read the role without decoding the token.
    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }