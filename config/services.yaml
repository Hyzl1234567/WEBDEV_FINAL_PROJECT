parameters:
    images_directory: '%kernel.project_dir%/public/uploads/images'
    app.timezone: 'Asia/Manila'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Session Handler
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'

    # Activity Log Doctrine Listener
    App\EventListener\ActivityLogDoctrineListener:
        tags:
            - { name: doctrine.event_subscriber }

    # User Checker for status validation
    App\Security\UserChecker:
        tags:
            - { name: security.user_checker }

    # Firebase Authentication Service for mobile app Google Sign-In
    App\Service\FirebaseAuthService:
        arguments:
            $credentialsPath: '%kernel.project_dir%/config/firebase/serviceAccountKey.json'